# Product FeatureUniverse: hub public surface (Phase 2 honest lock).
# Weights preserve historical relative units; Phase 2 additions are
# rubric-weighted (CONTRACT-core > composition > supporting > excluded).
# Policy: ONE global universe. sum(weights) == 1.0 globally.
# Family labels are organizational, not independent scoring categories.
# Gauntlet per-category 1.0 is waived: this is not 5 port-class categories.
# Excluded rows still carry non-zero weight (coverage debt for strict-100%).
# missing/excluded/partial require rationale (when not present) and retry_condition.
# evidence must be existing repo-relative paths, never bead IDs.
schema_version = "zerostack.supported_surface_matrix.v1"
project = "ZeroStack"
class = "Greenfield-Rust-class"
