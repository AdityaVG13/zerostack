[package]
name = "zerostack-codemode-conformance"
version = "0.1.0"
edition = "2021"
description = "ZeroStack CodeMode v1.0 conformance harness"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = "0.26"

[dev-dependencies]
tempfile = "3"
