# Product FeatureUniverse: hub public surface (Phase 2 ZeroKernel cutover lock).
# Weights preserve historical relative units for live rows. New kernel rows
# take weight from excluded zsx/zsx-core/zsx-node/F-ABI-ZERO-EXECUTE rows so
# sum(weights) == 1.0 globally. Excluded zsx IDs are kept (1 unit each) as
# strict-coverage debt so historical beads still grep.
# Policy: ONE global universe. Family labels are organizational, not
# independent scoring categories. Gauntlet per-category 1.0 is waived.
# Excluded rows still carry non-zero weight (coverage debt for strict-100%).
# missing/excluded/partial require rationale (when not present) and retry_condition.
# evidence must be existing repo-relative paths, never bead IDs.
# Partial NEVER rounds up. Honesty > green.
schema_version = "zerostack.supported_surface_matrix"
project = "ZeroStack"
class = "Greenfield-Rust-class"
source_base_schema = "gauntlet.supported_surface_matrix"
source_delta_schema = "gauntlet.surface_matrix_delta"
weight_policy = "global-sum-1.0"
weight_unit_denominator = 244
allowed_statuses = ["present", "partial", "missing", "excluded"]
cutover_lock = "2026-08-21-phase2-zerokernel"
subject_identity_label = "zerostack"
reference_identity_label = "spec-as-oracle"

