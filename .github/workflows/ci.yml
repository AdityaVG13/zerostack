name: ci

# MANUAL ONLY (workflow_dispatch). Per repo policy, no automatic triggers on
# push, pull_request, or schedule: this repo receives many small commits and
# automatic runs burn the GitHub Actions budget. Run from the Actions tab.
#
# Tests are NOT this workflow. DSR (`dsr quality`) is the repo-level
# release/quality runner; as of 2026-08-17 it has zero checks configured
# for zerostack. Targeted Cargo tests go through rch, never a GH job:
#   rch exec -- env CARGO_TARGET_DIR=/tmp/rch_target_zerostack \
#     cargo test -p <one> -- --test-threads=1
# Do not add a cargo test / cargo test --workspace job here: it hammers
# the Actions budget and the host. See docs/progress/AGENTS-MANDATE.md.
#
# The conformance-freshness job previously justified a daily cron, because the
# reports attest to engine revisions this repo does not control and can go
# stale with no commit here. That tradeoff no longer holds: freshness is
# checked when this workflow is dispatched, and staleness is tracked as work
# rather than as a nightly billed run.
on:
  workflow_dispatch:

# Least privilege: no write tokens, no id-token, no packages (AR-013).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  feature-universe:
    name: feature universe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 scripts/check_feature_universe_weights.py
      - run: python3 scripts/check_feature_coverage_dashboard.py
      - run: python3 scripts/check_bench_history.py

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      # Pins: full SHAs for third-party actions (AR-013). Tags in comments for humans.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # branch stable @ 2026-ish
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all --check
      # Lints are errors here on purpose. zerostack-0ne recorded two
      # clippy ERRORS sitting in the tree undetected because nothing ran
      # clippy at all; a warning-level gate would not have caught them.
      - run: cargo clippy --workspace -- -D warnings

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # branch stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo build --workspace

  # Local engine reports are ignored runtime evidence. CI cannot attest their freshness.
  privacy:
    name: no host paths in tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The hub is public. Nothing ran this gate in CI, so the only thing
      # stopping a leak was an agent remembering to run it by hand
      # (zerostack-9g4, zerostack-sg3).
      # One entrypoint so contributors run the same gate locally as CI. It
      # sequences the host-path, literal-tilde, and beads-export gates. The
      # export gate uses --check so CI reports an unscrubbed export instead of
      # silently fixing it and passing.
      - run: scripts/check-portability.sh
