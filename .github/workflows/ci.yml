name: public-contract

# DSR is the repository quality authority. This manual workflow is a portable
# public-contract check, not the release or full-test runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify canonical public surface
        run: python3 scripts/check_public_surface.py
      - name: Check benchmark harness syntax
        run: node --check benchmarks/zero-kernel-reference.cjs
