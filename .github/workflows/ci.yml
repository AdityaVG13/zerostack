name: ci

# MANUAL ONLY (workflow_dispatch). Per repo policy, no automatic triggers on
# push, pull_request, or schedule: this repo receives many small commits and
# automatic runs burn the GitHub Actions budget. Run from the Actions tab.
#
# The conformance-freshness job previously justified a daily cron, because the
# reports attest to engine revisions this repo does not control and can go
# stale with no commit here. That tradeoff no longer holds: freshness is
# checked when this workflow is dispatched, and staleness is tracked as work
# rather than as a nightly billed run.
on:
  workflow_dispatch:

# Least privilege: no write tokens, no id-token, no packages (AR-013).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  feature-universe:
    name: feature universe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 scripts/check_feature_universe_weights.py

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      # Pins: full SHAs for third-party actions (AR-013). Tags in comments for humans.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # branch stable @ 2026-ish
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all --check
      # Lints are errors here on purpose. zerostack-0ne recorded two
      # clippy ERRORS sitting in the tree undetected because nothing ran
      # clippy at all; a warning-level gate would not have caught them.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # branch stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test --workspace --all-targets --no-fail-fast

  packaged-codemode-conformance:
    name: packaged CodeMode conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: ZeroStack
    steps:
      # Keep the four repositories as siblings: zsx-core's engine adapters
      # intentionally use the same local composition layout as release builds.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ZeroStack
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: AdityaVG13/FSZero
          ref: d6ce69c5dfc2a2bccb457a535757bc44de51e928
          path: FSZero
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: AdityaVG13/GraphZero
          ref: 098306257adc563d5f45976d4420c68ceed721bd
          path: GraphZero
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: AdityaVG13/TokenZero
          ref: 54c77c01bdc7c8a60b6c801ef63307f8f5544189
          path: TokenZero
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # branch stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ZeroStack
      - run: cargo test -p zerostack-shared-tests --test program_assembly -- --test-threads=1
      - run: cargo test -p zsx-core --features fszero,graphzero,tokenzero --test canonical_mixed -- --test-threads=1
      - run: cargo test -p zsx-core --features fszero,graphzero,tokenzero --test request_cancellation -- --test-threads=1
      - run: cargo test -p zsx --test one_process -- --test-threads=1

  # Local engine reports are ignored runtime evidence. CI cannot attest their freshness.
  privacy:
    name: no host paths in tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The hub is public. Nothing ran this gate in CI, so the only thing
      # stopping a leak was an agent remembering to run it by hand
      # (zerostack-9g4, zerostack-sg3).
      # One entrypoint so contributors run the same gate locally as CI. It
      # sequences the host-path, literal-tilde, and beads-export gates. The
      # export gate uses --check so CI reports an unscrubbed export instead of
      # silently fixing it and passing.
      - run: scripts/check-portability.sh

  machine-permit-windows-ffi:
    name: machine-permit targeted Windows FFI coverage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # branch stable
      - run: cargo test -p zerostack-machine-permit --lib tests::native_wake_handle_closes_on_drop -- --exact
      - run: cargo test -p zerostack-machine-permit --lib tests::native_pid_liveness_handles_alive_dead_and_conservative_errors -- --exact


  windows-native-lifecycle:
    name: Windows native session and process lifecycle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # branch stable
      - run: cargo test -p zero-process --features test-fixture --test windows -- --test-threads=1
      - run: cargo test -p zero-codemode --features worker-fixture --test windows_session -- --test-threads=1
