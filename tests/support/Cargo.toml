[package]
name = "zerostack-test-support"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Reusable fixtures for root ZeroStack behavior tests"

[features]
default = []
git = ["dep:git2"]
graph = ["git", "dep:graphzero-store"]
kernel = ["dep:blake3", "dep:zero-abi", "dep:zero-pulse"]

[dependencies]
blake3 = { workspace = true, optional = true }
sha2.workspace = true
git2 = { workspace = true, optional = true }
graphzero-store = { workspace = true, optional = true }
tempfile.workspace = true
zero-abi = { workspace = true, optional = true }
zero-pulse = { workspace = true, optional = true }

[lints]
workspace = true
