[package]
name = "zerostack-shared-tests"
version = "0.1.0"
edition.workspace = true
publish = false
license.workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
jsonschema = "0.26"
regex = "1"
serde.workspace = true
serde_json.workspace = true
zero-abi = { path = "../crates/zero-abi" }
zero-codemode = { path = "../crates/zero-codemode" }
zero-testkit = { path = "../crates/zero-testkit" }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[bin]]
name = "zerostack-shared-conformance"
path = "src/main.rs"
