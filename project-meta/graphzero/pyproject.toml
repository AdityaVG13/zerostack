# GraphZero Python environment contract (non-package).
#
# The benchmark/rebaseline/ratchet Python drivers are intentionally
# stdlib-only plus the local module `benchmarks/rebaseline/stats.py`; there are
# no third-party dependencies, so this project pins only the Python
# interpreter and produces the lock file used by `uv run --locked`.
#
# Role of each file (do not conflate):
# - `.python-version` selects/pins the interpreter minor version (3.13).
# - `requires-python` here declares the compatibility bound and must stay
#   consistent with `.python-version`; the drivers have not been audited
#   against any other interpreter, so the bound is `>=3.13,<3.14`.
# - `uv.lock` locks dependency resolution (here: zero dependencies); it does
#   not record or pin an interpreter.
[project]
name = "graphzero-python-tools"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

# Not a package: no build backend, no install step. `uv run --locked --no-dev`
# only materializes the interpreter.
[tool.uv]
package = false
