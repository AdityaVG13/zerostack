# Dependabot update cadence for GitHub Actions SHA pins.
# Existing workflow/action pins use full commit SHAs; do not convert them
# back to mutable tags. Dependabot opens PRs that refresh those SHAs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
