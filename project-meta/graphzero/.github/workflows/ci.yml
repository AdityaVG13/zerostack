name: public-contract

# DSR is the repository quality authority. This workflow remains manual and
# checks portable public documentation and lightweight contracts only.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZEROSTACK_REF: bae540d3fe16b1d5f53948f293eb04a8c93e68c6

jobs:
  public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: GraphZero
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: AdityaVG13/ZeroStack
          ref: ${{ env.ZEROSTACK_REF }}
          path: ZeroStack
      - name: Reject private host paths
        working-directory: GraphZero
        run: python3 scripts/check_no_host_paths.py
      - name: Audit documented commands
        working-directory: GraphZero
        run: python3 scripts/readme_command_audit.py
      - name: Verify benchmark harness contracts
        working-directory: GraphZero
        run: python3 -m unittest scripts.test_bench_ratchet scripts.test_python_benchmark_environment -v
