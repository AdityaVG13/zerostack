name: GraphZero claim verification

on:
  workflow_dispatch:
    inputs:
      pr-body:
        description: PR body text containing GraphZero-Claim lines
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify PR GraphZero claims
        uses: ./.github/actions/graphzero-verify
        with:
          pr-body: ${{ github.event.pull_request.body || inputs['pr-body'] }}
          repo: .
