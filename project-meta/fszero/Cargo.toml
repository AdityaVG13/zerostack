[workspace]
members = [
    "crates/fszero-core",
    "crates/fszero-store",
    "crates/fszero-engine",
    "crates/fszero-kernel",
    "crates/fs-zero",
    "crates/fszero-cli",
    "crates/fszero-test-support",
    "tests",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# ZeroKernel clean cutover: consume the sibling hub contracts directly until the coordinated package publication.
zero-abi = { path = "../ZeroStack/crates/zero-abi" }
zero-ref = { path = "../ZeroStack/crates/zero-ref" }
zero-cert = { path = "../ZeroStack/crates/zero-cert" }
zero-store = { path = "../ZeroStack/crates/zero-store" }
zero-codemode = { git = "https://github.com/AdityaVG13/zerostack", rev = "bae540d3fe16b1d5f53948f293eb04a8c93e68c6" }
zero-mcp = { git = "https://github.com/AdityaVG13/zerostack", rev = "bae540d3fe16b1d5f53948f293eb04a8c93e68c6", features = ["fastmcp"] }
fszero-core = { path = "crates/fszero-core" }
fszero-store = { path = "crates/fszero-store" }
fszero-engine = { path = "crates/fszero-engine" }
fszero-kernel = { path = "crates/fszero-kernel" }
fs-zero = { path = "crates/fs-zero" }

[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "abort"
strip = false
