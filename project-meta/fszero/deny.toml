# cargo-deny supply-chain policy for FSZero.
# Run: cargo deny check   (advisories + licenses + bans + sources)

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/AdityaVG13/zerostack",
    "https://github.com/AdityaVG13/ast-sgrep.git",
    "https://github.com/AdityaVG13/ast-sgrep",
    "https://github.com/Dicklesworthstone/fastmcp_rust",
]
