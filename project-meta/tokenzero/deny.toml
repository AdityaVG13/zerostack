# cargo-deny supply-chain policy for TokenZero.
# Run: cargo deny check   (advisories + licenses + bans + sources)
# Allow-list matches the locked graph. Re-run `cargo deny check` after dep changes.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Declared by asupersync 0.3.5 and franken-* crates pulled through FastMCP.
    "LicenseRef-MIT-OpenAI-Anthropic-Rider",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/AdityaVG13/zerostack",
    "https://github.com/Dicklesworthstone/fastmcp_rust",
]
