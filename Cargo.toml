[workspace]
resolver = "3"
members = [
    "crates/zerostack/*",
    "crates/tokenzero/*",
    "crates/fszero/*",
    "crates/graphzero/graphzero-*",
    "tests/support",
    "tests/fszero",
]
exclude = [
    "conformance",
    "fuzz",
    "fuzz/*",
    ".rch-tmp",
    ".rch-tmp/*",
    "crates/graphzero/benchmarks",
    "project-meta/*",
    "tests/graphzero",
    "tests/tokenzero",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/AdityaVG13/zerostack"
homepage = "https://github.com/AdityaVG13/zerostack"
readme = "project-meta/tokenzero/README.md"
keywords = ["llm", "context", "compression", "tokens", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
ah-ah-ah = "0.1"
anyhow = "1.0.104"
assert_cmd = "2.2.2"
ast-sgrep-core = { git = "https://github.com/AdityaVG13/ast-sgrep.git", rev = "6b65549bd9db13f253b0f26a9f6b06b661dc41e4" }
ast-sgrep-lang = { git = "https://github.com/AdityaVG13/ast-sgrep.git", rev = "6b65549bd9db13f253b0f26a9f6b06b661dc41e4" }
blake3 = "1.8"
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
criterion = { version = "0.8", features = ["html_reports"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
fs4 = "1.1.0"
git2 = { version = "0.21", default-features = false }
globset = "0.4.20"
hdrhistogram = "7"
memchr = "2.8.3"
memmap2 = ">=0.9.11"
predicates = "3.1.4"
proptest = "1.11.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.4", default-features = false, features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serial_test = "4"
sha2 = "0.11.0"
similar = { version = "3.1.2", default-features = false, features = ["text"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tiktoken-rs = "0.12"
toml = "1.1.4"
tracing = "0.1"
wait-timeout = "0.2.1"

zerostack-test-support = { path = "tests/support" }
zerostack-conformance = { path = "crates/zerostack/zerostack-conformance" }
zerostack-install = { path = "crates/zerostack/zerostack-install" }
zero-abi = { path = "crates/zerostack/zero-abi" }
zero-cert = { path = "crates/zerostack/zero-cert" }
zero-codemode = { path = "crates/zerostack/zero-codemode" }
zero-gate = { path = "crates/zerostack/zero-gate" }
zero-gauge = { path = "crates/zerostack/zero-gauge" }
zero-ledger = { path = "crates/zerostack/zero-ledger" }
zero-kernel = { path = "crates/zerostack/zero-kernel" }
zero-mcp = { path = "crates/zerostack/zero-mcp" }
zero-process = { path = "crates/zerostack/zero-process" }
zero-ref = { path = "crates/zerostack/zero-ref" }
zero-store = { path = "crates/zerostack/zero-store" }
zero-machine-permit = { path = "crates/zerostack/zerostack-machine-permit" }

tokenzero-kernel = { path = "crates/tokenzero/tokenzero-kernel" }

fs-zero = { path = "crates/fszero/fs-zero" }
fszero-core = { path = "crates/fszero/fszero-core" }
fszero-engine = { path = "crates/fszero/fszero-engine" }
fszero-kernel = { path = "crates/fszero/fszero-kernel" }
fszero-store = { path = "crates/fszero/fszero-store" }

graphzero-engine = { path = "crates/graphzero/graphzero-engine", default-features = false }
graphzero-extract = { path = "crates/graphzero/graphzero-extract" }
graphzero-kernel = { path = "crates/graphzero/graphzero-kernel" }
graphzero-reserve = { path = "crates/graphzero/graphzero-reserve" }
graphzero-semantic = { path = "crates/graphzero/graphzero-semantic" }
graphzero-store = { path = "crates/graphzero/graphzero-store", default-features = false }
graphzero-test-support = { path = "crates/graphzero/graphzero-test-support" }
graphzero-types = { path = "crates/graphzero/graphzero-types" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
cognitive_complexity = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release-perf]
inherits = "release"
opt-level = 3
codegen-units = 1
incremental = false
lto = "fat"
debug = "line-tables-only"
strip = false
panic = "abort"

[profile.release-node]
inherits = "release"
codegen-units = 1
incremental = false
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release-perf"
