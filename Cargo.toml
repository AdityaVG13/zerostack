[workspace]
resolver = "2"
members = [
    "crates/zero-abi",
    "crates/zero-ref",
    "crates/zero-store",
    "crates/zerostack-machine-permit",
    "conformance",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release-perf]
inherits = "release"
codegen-units = 1
incremental = false
lto = "fat"
panic = "abort"
