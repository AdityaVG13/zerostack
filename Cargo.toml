[workspace]
resolver = "2"
exclude = ["conformance", "fuzz", ".rch-tmp", ".rch-tmp/*"]
members = [
    "crates/zero-abi",
    "crates/zero-cert",
    "crates/zero-codemode",
    "crates/zero-gate",
    "crates/zero-gauge",
    "crates/zero-ledger",
    "crates/zero-mcp",
    "crates/zero-process",
    "crates/zero-ref",
    "crates/zero-store",
    "crates/zerostack-machine-permit",
    "crates/zsx",
    "crates/zsx-core",
    "crates/zsx-node",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"

# GraphZero path dependencies (graphzero-query et al.) declare the hub crates
# through the GraphZero workspace's git pin (rev fa25384). Resolve them onto
# this local checkout, mirroring the GraphZero workspace's own patch, so the
# single-process zsx-core graph stays local and deterministic.
[patch."https://github.com/AdityaVG13/zerostack"]
zero-abi = { path = "crates/zero-abi" }
zero-cert = { path = "crates/zero-cert" }
zero-gate = { path = "crates/zero-gate" }
zero-gauge = { path = "crates/zero-gauge" }
zero-ledger = { path = "crates/zero-ledger" }
zero-process = { path = "crates/zero-process" }
zero-ref = { path = "crates/zero-ref" }
zero-store = { path = "crates/zero-store" }
zero-machine-permit = { path = "crates/zerostack-machine-permit" }

# Honest perf measurement profile (gauntlet keep-gate rule 3).
# Never use `--release` for a keep claim: size-optimized release can strip
# frames and change LTO/codegen enough to swamp the signal.
#
# Aligned with the gauntlet template:
#   opt-level = 3, codegen-units = 1, debug = "line-tables-only", strip = false
#
# LTO fat-vs-thin waiver: this workspace already uses lto = "fat" for
# release-perf and release-node. Switching to thin would change the binary
# versus every prior local measurement and versus the shipped Node addon
# profile family. Fat LTO is kept on purpose and named here. This is not a
# silent lying profile: line tables stay, symbols stay, panic=abort stays.
# Cargo has no per-profile key for frame pointers; honest runs must also set
#   RUSTFLAGS="-C force-frame-pointers=yes"
[profile.release-perf]
inherits = "release"
opt-level = 3
codegen-units = 1
incremental = false
lto = "fat"
debug = "line-tables-only"
strip = false
panic = "abort"

# Native package profile: preserve release semantics while minimizing the
# shipped Node addon. Keep this separate from release-perf so CLI benchmarks
# remain tuned for runtime speed.
[profile.release-node]
inherits = "release"
codegen-units = 1
incremental = false
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
