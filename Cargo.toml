[workspace]
resolver = "2"
exclude = ["conformance"]
members = [
    "crates/zero-abi",
    "crates/zero-cert",
    "crates/zero-codemode",
    "crates/zero-gate",
    "crates/zero-gauge",
    "crates/zero-ledger",
    "crates/zero-ref",
    "crates/zero-store",
    "crates/zero-testkit",
    "crates/zerostack-machine-permit",
    "tests",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"

[profile.release-perf]
inherits = "release"
codegen-units = 1
incremental = false
lto = "fat"
panic = "abort"
