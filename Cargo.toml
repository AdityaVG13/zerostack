[workspace]
resolver = "2"
exclude = ["conformance"]
members = [
    "crates/zero-abi",
    "crates/zero-cert",
    "crates/zero-codemode",
    "crates/zero-gate",
    "crates/zero-gauge",
    "crates/zero-ledger",
    "crates/zero-mcp",
    "crates/zero-process",
    "crates/zero-ref",
    "crates/zero-store",
    "crates/zerostack-machine-permit",
    "crates/zsx",
    "crates/zsx-core",
    "crates/zsx-node",
    "crates/zerostack-harness",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"

# GraphZero path dependencies (graphzero-query et al.) declare the hub crates
# through the GraphZero workspace's git pin (rev fa25384). Resolve them onto
# this local checkout, mirroring the GraphZero workspace's own patch, so the
# single-process zsx-core graph stays local and deterministic.
[patch."https://github.com/AdityaVG13/zerostack"]
zero-abi = { path = "crates/zero-abi" }
zero-cert = { path = "crates/zero-cert" }
zero-gate = { path = "crates/zero-gate" }
zero-gauge = { path = "crates/zero-gauge" }
zero-ledger = { path = "crates/zero-ledger" }
zero-process = { path = "crates/zero-process" }
zero-ref = { path = "crates/zero-ref" }
zero-store = { path = "crates/zero-store" }
zero-machine-permit = { path = "crates/zerostack-machine-permit" }

[profile.release-perf]
inherits = "release"
codegen-units = 1
incremental = false
lto = "fat"
panic = "abort"

# Native package profile: preserve release semantics while minimizing the
# shipped Node addon. Keep this separate from release-perf so CLI benchmarks
# remain tuned for runtime speed.
[profile.release-node]
inherits = "release"
codegen-units = 1
incremental = false
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
