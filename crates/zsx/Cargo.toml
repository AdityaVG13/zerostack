[package]
autotests = false
name = "zsx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Single-process canonical ZSX executable: zsx exec runs the embedded zsx-core directly"

[lib]
name = "zsx_cli"
path = "src/lib.rs"

[[bin]]
name = "zsx"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
zsx-core = { path = "../zsx-core", features = ["fszero", "graphzero", "tokenzero"] }

[dev-dependencies]
zero-abi = { path = "../zero-abi" }

[[test]]
name = "supervisor"
path = "../../tests/unit/zsx/supervisor.rs"

[[test]]
name = "k0_budgets"
path = "../../tests/unit/zsx/k0_budgets.rs"
