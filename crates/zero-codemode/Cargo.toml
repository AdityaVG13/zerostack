[package]
name = "zero-codemode"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure-safe generic CodeMode host foundation"

[features]
default = []
fastmcp = ["dep:fastmcp-rust"]
worker-fixture = []

[[bin]]
name = "zerostack-codemode-host"
path = "src/bin/zerostack-codemode-host.rs"

[[bin]]
name = "zerostack-session"
path = "src/bin/zerostack-session.rs"

[[bin]]
name = "zsx"
path = "src/bin/zsx.rs"

[[bin]]
name = "zero-codemode-worker-fixture"
path = "src/bin/worker_fixture.rs"
required-features = ["worker-fixture"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
zero-abi = { path = "../zero-abi" }
zero-store = { path = "../zero-store" }
tree-sitter = "0.26.12"
tree-sitter-javascript = "0.25.0"
command-group = "5.0.1"
sha2.workspace = true
fastmcp-rust = { git = "https://github.com/Dicklesworthstone/fastmcp_rust", rev = "1c66097b15dea9550e833ee9e433beeb66eefece", optional = true }
zerostack-machine-permit = { path = "../zerostack-machine-permit" }

[dev-dependencies]
tempfile = "3"
