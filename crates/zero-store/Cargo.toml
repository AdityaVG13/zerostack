[package]
autotests = false
name = "zero-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Canonical ZeroRef v1 content-addressed store layout and publish protocol"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = "2"
zero-abi = { path = "../zero-abi" }
zero-ref = { path = "../zero-ref" }

[dev-dependencies]
libc = "0.2"
tempfile = "3"

[[test]]
name = "gc_publication"
path = "../../tests/rust/zero-store/gc_publication.rs"

[[test]]
name = "idle_gate_host"
path = "../../tests/rust/zero-store/idle_gate_host.rs"
