[package]
name = "fszero-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FSZero bytes/CAS/recovery authority."
autotests = false
publish = false

[features]
default = []
dev-harness = []
sqlite-bundled = ["rusqlite/bundled"]

[dependencies]
fszero-core.workspace = true
fsqlite = { workspace = true }
fsqlite-core = { workspace = true }
rusqlite = { workspace = true, features = ["backup"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
unicode-normalization = { workspace = true }
zero-abi.workspace = true
zero-ref.workspace = true
zero-store.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
zerostack-test-support = { workspace = true }

[target.'cfg(unix)'.dependencies]
xattr = { workspace = true }

[[test]]
name = "cas_put_prehashed"
path = "../../../tests/fszero/store_cas_put_prehashed.rs"

[[test]]
name = "journal_delta_gap"
path = "../../../tests/fszero/store_journal_delta_gap.rs"

[[test]]
name = "capsule_store"
path = "../../../tests/fszero/store_capsule_store.rs"

[[test]]
name = "path_confinement"
path = "../../../tests/fszero/store_path_confinement.rs"

[[test]]
name = "seq_ref_scoped"
path = "../../../tests/fszero/store_seq_ref_scoped.rs"

[[test]]
name = "store_durable_integrity"
path = "../../../tests/fszero/store_durable_integrity.rs"
