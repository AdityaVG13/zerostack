[package]
name = "fszero-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Typed FSZero FileEngine implementation for ZeroKernel"
autotests = false
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fszero-store.workspace = true
zero-abi.workspace = true
zero-store.workspace = true

[dev-dependencies]
parking_lot = "0.12"
tempfile = "3.27.0"

# Root test: FileEngine capsule publication adapter (tests/engine/).
[[test]]
name = "capsule_adapter"
path = "../../../tests/fszero/engine/capsule_adapter.rs"
