[package]
name = "fszero-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FSZero fs_ops / dispatch engine."
autotests = false
publish = false

[features]
default = []
fszero-ast-sgrep = ["dep:ast-sgrep-lang", "dep:ast-sgrep-core"]
fszero-semantic-local = ["dep:frankensearch"]
watch = ["dep:notify"]
dev-harness = ["fszero-store/dev-harness"]
search-eval = []
sqlite-bundled = ["fszero-store/sqlite-bundled"]

[dependencies]
fszero-core.workspace = true
fszero-store.workspace = true
fsqlite = "0.1.19"
fsqlite-core = "0.1.19"
sha2 = "0.11.0"
rayon = "1.12"
memchr = "2"
regex = "1"
unicode-normalization = "0.1"
rusqlite = { version = "0.40", features = ["backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zero-abi.workspace = true
zero-ref.workspace = true
zero-cert.workspace = true
zero-store.workspace = true
ignore = "0.4"
ast-sgrep-lang = { git = "https://github.com/AdityaVG13/ast-sgrep.git", rev = "ab3bdc395446d90566e52ccc6cdb761b55dc228b", optional = true }
ast-sgrep-core = { git = "https://github.com/AdityaVG13/ast-sgrep.git", rev = "ab3bdc395446d90566e52ccc6cdb761b55dc228b", optional = true }
frankensearch = { version = "0.3.2", default-features = false, features = ["hash", "lexical"], optional = true }
notify = { version = "8.2.0", optional = true }

[target.'cfg(unix)'.dependencies]
xattr = "1"

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1"
serde_json = "1"
zero-abi.workspace = true

[[test]]
name = "stale_preimage"
path = "../../../tests/fszero/engine/stale_preimage.rs"

[[test]]
name = "file_engine_restore"
path = "../../../tests/fszero/engine/file_engine_restore.rs"

[[test]]
name = "cancel_after_publish"
path = "../../../tests/fszero/engine/cancel_after_publish.rs"

[[test]]
name = "file_engine_patch"
path = "../../../tests/fszero/engine/file_engine_patch.rs"

[[test]]
name = "lookup_budget"
path = "../../../tests/fszero/engine/lookup_budget.rs"

[[test]]
name = "world_overlap"
path = "../../../tests/fszero/engine/world_overlap.rs"

[[test]]
name = "world_fifo"
path = "../../../tests/fszero/engine/world_fifo.rs"

[[test]]
name = "search_fifo"
path = "../../../tests/fszero/engine/search_fifo.rs"

[[test]]
name = "special_file_mutation"
path = "../../../tests/fszero/engine/special_file_mutation.rs"

[[test]]
name = "undo_fifo"
path = "../../../tests/fszero/engine/undo_fifo.rs"

[[test]]
name = "rollback_fifo"
path = "../../../tests/fszero/engine/rollback_fifo.rs"

[[test]]
name = "symlink_replace"
path = "../../../tests/fszero/engine/symlink_replace.rs"

[[test]]
name = "hardlink_replace"
path = "../../../tests/fszero/engine/hardlink_replace.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("default", "fszero-ast-sgrep", "fszero-semantic-local", "watch", "dev-harness", "search-eval", "sqlite-bundled"))'] }
