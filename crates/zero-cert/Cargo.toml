[package]
autobenches = false
autotests = false
name = "zero-cert"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure verification of proof-carrying RACC evidence certificates"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
zero-abi = { path = "../zero-abi" }
zero-ref = { path = "../zero-ref" }

[dev-dependencies]
allocation-counter = "0.8"
criterion = "0.5"
proptest = "1"

[[bench]]
name = "verify"
harness = false
path = "../../tests/benches/zero-cert/verify.rs"

[[test]]
name = "effect_witness"
path = "../../tests/rust/zero-cert/effect_witness.rs"

[[test]]
name = "golden_vectors"
path = "../../tests/rust/zero-cert/golden_vectors.rs"

[[test]]
name = "property"
path = "../../tests/rust/zero-cert/property.rs"
