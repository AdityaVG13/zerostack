[package]
name = "zero-gate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Proof-carrying deterministic decision gate for ZeroStack"

[dependencies]
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zero-abi = { path = "../zero-abi" }
zero-cert = { path = "../zero-cert" }
zero-ledger = { path = "../zero-ledger" }
zero-store = { path = "../zero-store" }

[dev-dependencies]
tempfile = "3"
criterion = "0.5"
proptest = "1"
stats_alloc = "0.1"

[[bench]]
name = "decide"
harness = false
