[package]
autobenches = false
autotests = false
name = "zero-gate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Proof-carrying deterministic decision gate for ZeroStack"

[dependencies]
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zero-abi = { path = "../zero-abi" }
zero-cert = { path = "../zero-cert" }
zero-ledger = { path = "../zero-ledger" }
zero-store = { path = "../zero-store" }

[[bin]]
name = "zerostack-program-evidence"
path = "src/bin/program-evidence.rs"

[[test]]
name = "project_image_q99"
path = "../../tests/unit/zero-gate/project_image_q99.rs"

[[test]]
name = "demand_expand"
path = "../../tests/unit/zero-gate/demand_expand.rs"
