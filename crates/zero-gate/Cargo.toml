[[test]]
name = "project_image_q99"
path = "../../tests/zero_gate_project_image_q99.rs"

[[test]]
name = "demand_expand"
path = "../../tests/zero_gate_demand_expand.rs"

[[test]]
name = "snap_to_file"
path = "../../tests/zero_gate_snap_to_file.rs"

[lints]
workspace = true
