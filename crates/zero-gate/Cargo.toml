[package]
autobenches = false
autotests = false
name = "zero-gate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Proof-carrying deterministic decision gate for ZeroStack"

[dependencies]
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zero-abi = { path = "../zero-abi" }
zero-cert = { path = "../zero-cert" }
zero-ledger = { path = "../zero-ledger" }
zero-store = { path = "../zero-store" }

[dev-dependencies]
tempfile = "3"
criterion = "0.5"
proptest = "1"
stats_alloc = "0.1"

[[bin]]
name = "zerostack-program-evidence"
path = "src/bin/program-evidence.rs"

[[bench]]
name = "decide"
harness = false
path = "../../tests/benches/zero-gate/decide.rs"

[[test]]
name = "aggregate_program_receipt"
path = "../../tests/rust/zero-gate/aggregate_program_receipt.rs"

[[test]]
name = "allocation"
path = "../../tests/rust/zero-gate/allocation.rs"

[[test]]
name = "program_evidence"
path = "../../tests/rust/zero-gate/program_evidence.rs"

[[test]]
name = "program_proof"
path = "../../tests/rust/zero-gate/program_proof.rs"

[[test]]
name = "properties"
path = "../../tests/rust/zero-gate/properties.rs"

[[test]]
name = "real_gc"
path = "../../tests/rust/zero-gate/real_gc.rs"
