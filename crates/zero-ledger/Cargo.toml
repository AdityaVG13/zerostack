[package]
autobenches = false
autotests = false
name = "zero-ledger"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "RACC resource gauge, T8 exposure/replay identity, and exact-phase dominance receipt for ZeroStack"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
zero-abi = { path = "../zero-abi" }

[dev-dependencies]
allocation-counter = "0.8"
criterion = "0.5"
proptest = "1"

[[bench]]
name = "charge"
harness = false
path = "../../tests/benches/zero-ledger/charge.rs"

[[test]]
name = "allocation"
path = "../../tests/rust/zero-ledger/allocation.rs"

[[test]]
name = "exact_checks"
path = "../../tests/rust/zero-ledger/exact_checks.rs"

[[test]]
name = "fresh_work_conformance"
path = "../../tests/rust/zero-ledger/fresh_work_conformance.rs"
