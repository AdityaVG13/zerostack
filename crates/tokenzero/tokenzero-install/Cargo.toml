[package]
name = "tokenzero-install"
version = "1.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Installer and agent-wiring for TokenZero (Claude/Codex/Grok/etc.)."
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
autotests = false

# Classic MCP remains an explicit compatibility package marker. The canonical
# raw worker is a separate planner-free artifact, not a selectable surface.
[features]
default = []
surface-mcp = []

[dependencies]
zerostack-install.workspace = true
flate2.workspace = true
fs4.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tokenzero-core = { path = "../tokenzero-core", version = "1.0.2" }
zero-store.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

# Live contract proofs only. d8c0844 pruned the rest; missing test
# targets were deleted in Phase 1 rather than left compile-broken.
[[test]]
name = "install_unit_package_audit"
path = "../../../tests/tokenzero/install/unit/package_audit/mod.rs"

[[test]]
name = "rollback_drift"
path = "../../../tests/tokenzero/unit/tokenzero-install/rollback_drift.rs"
