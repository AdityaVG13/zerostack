[package]
autotests = false
name = "zero-process"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hub-owned process identity, owner-death, and verified child-tree lifecycle"
autobins = false

[features]
default = []
test-fixture = []

[[bin]]
name = "process_fixture"
path = "src/bin/process_fixture.rs"
required-features = ["test-fixture"]


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }

[[test]]
name = "child"
path = "../../tests/rust/zero-process/child.rs"

[[test]]
name = "windows"
path = "../../tests/rust/zero-process/windows.rs"
