[package]
name = "zerostack-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Greenfield Subject≠Oracle harness. Implements conformance/CONTRACT.md; not a second MCP catalog."

[[bin]]
name = "oracle-preflight-doctor"
path = "src/bin/oracle-preflight-doctor.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = "0.8"
zero-abi = { path = "../zero-abi" }
zero-ledger = { path = "../zero-ledger" }
zero-process = { path = "../zero-process" }
zero-ref = { path = "../zero-ref" }
zero-store = { path = "../zero-store" }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
