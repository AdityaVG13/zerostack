[package]
name = "zero-machine-permit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared ZeroStack CodeMode machine permit (slot locks, reclaim, backoff)."

[dependencies]
zero-process = { path = "../zero-process" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[lints]
workspace = true
