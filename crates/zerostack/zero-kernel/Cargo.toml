[package]
name = "zero-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Daemonless in-process ZeroKernel runtime with direct z bindings"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
parking_lot = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-typescript = { workspace = true }
zero-codemode = { workspace = true }
zero-token.workspace = true
zero-graph.workspace = true
zero-fs.workspace = true
blake3 = { workspace = true }
fs4 = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zero-abi = { workspace = true }
zero-gate = { workspace = true }
zero-gauge = { workspace = true }
zero-mcp = { workspace = true, optional = true, features = ["fastmcp"] }
zero-process = { workspace = true }
zero-store = { workspace = true }
zero-pulse = { workspace = true }

[features]
# The FastMCP stdio carrier (the `zero-kernel mcp` command) is transport, not
# the canonical surface; embedders that call the direct `z` API in-process can
# drop it and its nightly-gated asupersync dependency chain.
default = ["mcp-carrier"]
mcp-carrier = ["dep:zero-mcp"]

[dev-dependencies]
tempfile = { workspace = true }
zerostack-test-support = { workspace = true, features = ["kernel"] }
[[test]]
name = "direct_host"
path = "../../../tests/zero_kernel_direct_host.rs"

[[test]]
name = "provider_usage"
path = "../../../tests/zero_kernel_provider_usage.rs"

[[test]]
name = "speculation"
path = "../../../tests/zero_kernel_speculation.rs"

[[test]]
name = "pulse_record"
path = "../../../tests/zero_kernel_pulse_record.rs"
[[test]]
name = "product_integration"
path = "../../../tests/zero_kernel_product_integration.rs"


[[bin]]
name = "zero-kernel"
path = "src/bin/zero_kernel.rs"

[lints]
workspace = true
