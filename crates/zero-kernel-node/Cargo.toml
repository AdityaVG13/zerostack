[package]
name = "zero-kernel-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "N-API binding for daemonless in-process ZeroKernel"

[lib]
crate-type = ["cdylib"]
name = "zero_kernel_node"

[dependencies]
napi = { version = "3.12.1", features = ["serde-json", "napi6"] }
napi-derive = "3.6.3"
parking_lot = "0.12"
serde_json.workspace = true
zero-abi = { path = "../zero-abi" }
zero-kernel = { path = "../zero-kernel" }
zero-store = { path = "../zero-store" }

[build-dependencies]
napi-build = "2.4.1"
