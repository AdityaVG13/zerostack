[package]
name = "graphzero-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Content-addressed snapshots, indexes, and structural evidence storage for GraphZero"
autotests = false

[features]
default = []
# Non-default build identity for deliberate durability crash injection.
crash-injection = []
benchmarks = ["dep:criterion"]

[dependencies]
anyhow = { workspace = true }
graphzero-extract = { workspace = true }
graphzero-types = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
hdrhistogram = { workspace = true }
zstd = { workspace = true }
bytemuck = { workspace = true }
crc32fast = { workspace = true }
memmap2 = { workspace = true }
sha2 = { workspace = true }
zero-abi = { workspace = true }
zero-ref = { workspace = true }
zero-store = { workspace = true }
git2 = { workspace = true }
rayon = { workspace = true }
crossbeam-queue = { workspace = true }
criterion = { workspace = true, optional = true }

[dev-dependencies]
zerostack-test-support = { workspace = true, features = ["git"] }
proptest = { workspace = true }
tempfile = { workspace = true }
serial_test = { workspace = true }

[[bench]]
name = "budgets"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "query_warm"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "query_cold"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "branch_switch"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "query_warm_breakdown"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "cold_breakdown"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "snap_to_file"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "blast_precomp"
harness = false
required-features = ["benchmarks"]

[lints]
workspace = true

[[test]]
name = "store_crash_boundary_store"
path = "../../../tests/graphzero/store_crash_boundary_store.rs"

[[test]]
name = "store_durability_receipt_contract"
path = "../../../tests/graphzero/store_durability_receipt_contract.rs"

[[test]]
name = "store_external_store_contract"
path = "../../../tests/graphzero/store_external_store_contract.rs"

[[test]]
name = "store_ref_index_contract"
path = "../../../tests/graphzero/store_ref_index_contract.rs"

[[test]]
name = "store_zeroref_fragment_conformance"
path = "../../../tests/graphzero/store_zeroref_fragment_conformance.rs"

[[test]]
name = "store_memory_ref_identity"
path = "../../../tests/graphzero/store_memory_ref_identity.rs"

[[test]]
name = "store_publish_schema_identity"
path = "../../../tests/graphzero/store_publish_schema_identity.rs"

[[test]]
name = "store_path_safety"
path = "../../../tests/graphzero/store_path_safety.rs"
