[package]
name = "graphzero-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "GraphZero structural query, impact, and evidence domain library"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
autotests = false
autobins = false
autoexamples = false


[features]
# Query compatibility is limited to recipe and JSON-DAG plans.
default = []

[dependencies]
zero-abi = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
graphzero-store = { workspace = true }
graphzero-core = { workspace = true }
graphzero-types = { workspace = true }
graphzero-coverage = { workspace = true }
graphzero-reserve = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
zerostack-test-support = { workspace = true, features = ["graph"] }

[[bench]]
name = "query_surface"
harness = false

[lints]
workspace = true

[[test]]
name = "query_blast_proptest"
path = "../../../tests/graphzero/query_blast_proptest.rs"

