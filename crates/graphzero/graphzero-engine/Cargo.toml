[package]
name = "graphzero-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[features]
# Query compatibility is limited to recipe and JSON-DAG plans.
default = []

[dependencies]
blake3.workspace = true
ast-sgrep-core.workspace = true
ast-sgrep-lang.workspace = true
zero-abi = { workspace = true }
zero-store = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
graphzero-store = { workspace = true, features = ["tokenzero"] }
graphzero-core = { path = "../graphzero-core" }
graphzero-types = { workspace = true }
libc = "0.2"
graphzero-coverage = { path = "../graphzero-coverage" }
graphzero-reserve = { workspace = true }
rayon = "1.12"

[dev-dependencies]
graphzero-test-support = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
git2 = { workspace = true }
sha2 = { workspace = true }
serial_test = { workspace = true }

[[bench]]
name = "query_surface"
harness = false

[[bin]]
name = "gzero"
path = "src/bin/gzero.rs"

[[bin]]
name = "gz-surface-bench-worker"
path = "src/bin/gz_surface_bench_worker.rs"

[[bin]]
name = "gz-raw-worker"
path = "src/bin/gz_raw_worker.rs"

[[bench]]
name = "codemode"
harness = false

[lints]
workspace = true

[[test]]
name = "query_blast_proptest"
path = "../../../tests/graphzero/engine/blast_proptest.rs"

[[test]]
name = "query_conformance_corpus"
path = "../../../tests/graphzero/engine/conformance_corpus.rs"

[[test]]
name = "query_operation_abi_contract"
path = "../../../tests/graphzero/engine/operation_abi_contract.rs"

[[test]]
name = "query_perf_profile_contract"
path = "../../../tests/graphzero/engine/perf_profile_contract.rs"

[[test]]
name = "zero_kernel_scoped"
path = "../../../tests/graphzero/engine/zero_kernel_scoped.rs"

[[test]]
name = "zero_kernel_cpu_bound"
path = "../../../tests/graphzero/engine/zero_kernel_cpu_bound.rs"
[[test]]
name = "zero_kernel_task_lens"
path = "../../../tests/graphzero/engine/zero_kernel_task_lens.rs"
