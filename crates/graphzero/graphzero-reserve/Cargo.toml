proptest = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "reserve_check"
harness = false

[lints]
workspace = true

[[test]]
name = "reserve_crash_boundary_reserve"
path = "../../../tests/graphzero/reserve_crash_boundary_reserve.rs"

[[test]]
name = "reserve_reserve_contract"
path = "../../../tests/graphzero/reserve_reserve_contract.rs"

[[test]]
name = "reserve_reserve_proptest"
path = "../../../tests/graphzero/reserve_reserve_proptest.rs"


