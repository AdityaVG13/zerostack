[package]
name = "graphzero-reserve"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Intent reservation and conflict detection for GraphZero"
autotests = false

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
graphzero-store = { workspace = true }

[dev-dependencies]
zerostack-test-support = { workspace = true, features = ["graph"] }
