[package]
name = "graphzero-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false
autobins = false

[features]
# Legacy surface flags remain empty so historical cfg branches stay excluded.
default = ["tokenzero"]
tokenzero = ["graphzero-store/tokenzero"]
surface-mcp = []
surface-codemode = []

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
graphzero-store = { workspace = true }
graphzero-pack = { path = "../graphzero-pack" }
graphzero-scip = { path = "../graphzero-scip" }
graphzero-engine = { workspace = true }
graphzero-reserve = { workspace = true }
graphzero-why = { path = "../graphzero-why" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
graphzero-test-support = { workspace = true }
graphzero-extract = { workspace = true }
tempfile = { workspace = true }
git2 = { workspace = true }
tiktoken-rs = { workspace = true }
ah-ah-ah = { workspace = true }
graphzero-semantic = { workspace = true }
graphzero-engine = { workspace = true }
graphzero-reserve = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }

[lib]
name = "graphzero"
path = "src/lib.rs"

[[bin]]
name = "graphzero"
path = "src/main.rs"

[[test]]
name = "cli_capabilities_no_v6"
path = "../../../tests/graphzero/cli/capabilities_no_v6.rs"

[lints]
workspace = true
