[package]
autotests = false
name = "zsx-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Single-process canonical ZSX composition: in-process DomainAdapter contract, aggregate connector, and session authority"

[features]
default = []
fixture-adapters = []
# Real FSZero engine adapter over the engine's public domain API. The fs-zero
# dependency builds with default-features = false so no MCP, CodeMode, watch,
# or AST-sgrep surface is linked; sqlite-bundled keeps the durable store
# deterministic on any host.
fszero = ["dep:fs-zero"]
# Real GraphZero engine adapter over the embedded GraphZero query crate.
graphzero = ["dep:graphzero-query", "dep:graphzero-store"]
# Real TokenZero engine adapter over the public embedded domain API.
tokenzero = ["dep:tokenzero-core", "dep:tokenzero-engine", "dep:tokenzero-recovery"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
fs-zero = { path = "../../../FSZero/crates/fs-zero", default-features = false, features = ["sqlite-bundled"], optional = true }
graphzero-query = { package = "graphzero-engine", path = "../../../GraphZero/crates/graphzero-engine", optional = true }
graphzero-store = { path = "../../../GraphZero/crates/graphzero-store", optional = true }
tokenzero-core = { path = "../../../TokenZero/crates/tokenzero-core", optional = true }
tokenzero-engine = { path = "../../../TokenZero/crates/tokenzero-engine", optional = true }
tokenzero-recovery = { path = "../../../TokenZero/crates/tokenzero-recovery", optional = true }
zero-abi = { path = "../zero-abi" }
zero-codemode = { path = "../zero-codemode" }
zero-ref = { path = "../zero-ref" }
zero-store = { path = "../zero-store" }
zero-machine-permit = { path = "../zerostack-machine-permit" }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "aggregate_world"
path = "../../tests/rust/zsx-core/aggregate_world.rs"

[[test]]
name = "canonical_mixed"
path = "../../tests/rust/zsx-core/canonical_mixed.rs"

[[test]]
name = "request_cancellation"
path = "../../tests/rust/zsx-core/request_cancellation.rs"

[[test]]
name = "verdict_loop"
path = "../../tests/rust/zsx-core/verdict_loop.rs"

[[test]]
name = "verdict_loop_canonical"
path = "../../tests/rust/zsx-core/verdict_loop_canonical.rs"
