[package]
name = "tokenzero-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"

[dependencies.tokenzero-core]
path = "../../crates/tokenzero/tokenzero-core"

[dependencies.tokenzero-recovery]
path = "../../crates/tokenzero/tokenzero-recovery"

[[bin]]
name = "expand_fragment_differential"
path = "fuzz_targets/expand_fragment_differential.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
