[package]
name = "zerostack-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zero-ref = { path = "../crates/zerostack/zero-ref" }
graphzero-store = { path = "../crates/graphzero/graphzero-store" }

[workspace]
members = ["."]

[[bin]]
name = "zeroref_parse"
path = "fuzz_targets/zeroref_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graphzero_delta_codec"
path = "fuzz_targets/graphzero_delta_codec.rs"
test = false
doc = false
bench = false


[profile.release]
debug = 1
